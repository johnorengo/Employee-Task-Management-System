name: campus-etms
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: etms_db
      POSTGRES_USER: etms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -U, etms, -d, etms_db]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: etms_db
      DB_USERNAME: etms
      DB_PASSWORD: ${DB_PASSWORD}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAIL_PORT:-8026}:8025"
    restart: unless-stopped
volumes:
  postgres_data:
